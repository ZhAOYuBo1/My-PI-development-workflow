<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="126" y1="102" x2="874" y2="934" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7749FF"/>
      <stop offset="0.48" stop-color="#4C55F6"/>
      <stop offset="1" stop-color="#20D7C4"/>
    </linearGradient>
    <linearGradient id="screen" x1="324" y1="414" x2="702" y2="654" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5262F6"/>
      <stop offset="0.58" stop-color="#426FEF"/>
      <stop offset="1" stop-color="#17C9C0"/>
    </linearGradient>
    <linearGradient id="shine" x1="276" y1="170" x2="628" y2="552" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.32"/>
