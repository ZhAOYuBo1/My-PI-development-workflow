<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="118" y1="91" x2="900" y2="926" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7548FF"/>
      <stop offset="0.5" stop-color="#4E57F5"/>
      <stop offset="1" stop-color="#20D7C4"/>
    </linearGradient>
    <linearGradient id="screen" x1="322" y1="318" x2="699" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#515FF5"/>
      <stop offset="0.6" stop-color="#397BEC"/>
      <stop offset="1" stop-color="#16C9BF"/>
    </linearGradient>
    <linearGradient id="glow" x1="125" y1="118" x2="500" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.36"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="120" y="117" width="820" height="812" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#25217F" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#bg)"/>
  <path d="M117 322C188 169 330 91 491 76C331 136 229 254 190 406C159 383 137 355 117 322Z" fill="url(#glow)"/>

  <!-- Friendly Pi symbol, tilted like the CodeBuddy mark -->
  <g transform="rotate(-12 512 512)" filter="url(#shadow)">
    <!-- Pi top beam -->
    <rect x="194" y="250" width="636" height="230" rx="105" fill="white"/>
    <!-- Pi legs -->
    <path d="M248 403H433V747C433 803 388 848 332 848C286 848 248 810 248 764V403Z" fill="white"/>
    <path d="M591 403H776V764C776 810 738 848 692 848C636 848 591 803 591 747V403Z" fill="white"/>

    <!-- rounded robot screen inside the Pi beam -->
    <rect x="286" y="300" width="452" height="148" rx="74" fill="url(#screen)"/>
    <path d="M322 323C391 283 541 279 681 344V372C557 321 429 323 322 369V323Z" fill="white" fill-opacity="0.13"/>

    <!-- CodeBuddy-inspired eyes -->
    <rect x="411" y="324" width="39" height="78" rx="20" transform="rotate(-18 411 324)" fill="white"/>
    <rect x="565" y="303" width="39" height="78" rx="20" transform="rotate(-18 565 303)" fill="white"/>

    <!-- small connector notch to emphasize the geometric Pi construction -->
    <rect x="477" y="470" width="70" height="84" rx="25" fill="white"/>
  </g>

  <path d="M824 708C824 672 853 643 889 643C853 643 824 614 824 578C824 614 795 643 759 643C795 643 824 672 824 708Z" fill="white" fill-opacity="0.92"/>
</svg>
