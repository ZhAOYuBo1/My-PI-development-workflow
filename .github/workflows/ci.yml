name: CodePIddy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test CodePIddy core
        run: npm test --workspace=@codepiddy/core
      - name: Test CodePIddy desktop
        run: npm test --workspace=@codepiddy/desktop
      - name: Static checks
        run: npm run check
      - name: Build CodePIddy
        run: npm run build:codepiddy
